<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e8a86">
<meta name="theme-color" content="#0d1a1a" media="(prefers-color-scheme:dark)">
<title>Fridgey</title>
<script>
// 테마는 화면이 그려지기 전에 적용한다(기본 테마가 잠깐 보였다가 바뀌지 않게). data.theme 과 같은 값을 fridgey.skin 에 따로 둔다.
var SKINS = { mint: ["민트", "#0e8a86", "#0d1a1a"], pink: ["핑크", "#d1127a", "#1c0b14"], white: ["화이트", "#ffffff", "#ffffff"], purple: ["퍼플", "#6d28d9", "#120b22"], blue: ["블루", "#1d5fd6", "#0a1222"] };
function applySkin(s) {
  if (!SKINS[s]) s = "mint";
  document.documentElement.dataset.skin = s;
  var m = document.querySelectorAll('meta[name="theme-color"]');   // 폰 상단 상태바 색
  if (m[0]) m[0].content = SKINS[s][1];
  if (m[1]) m[1].content = SKINS[s][2];
  try { localStorage.setItem("fridgey.skin", s); } catch (e) {}
}
(function () {
  var s = null;
  try { s = localStorage.getItem("fridgey.skin") || JSON.parse(localStorage.getItem("fridgey.data")).theme; } catch (e) {}
  applySkin(s);
})();
</script>

<style>
:root{--bg:#f4f8f8;--card:#fff;--ink:#12302f;--sub:#5c7776;--line:#dbe7e6;--field:#769594;--main:#0b7571;--main-ink:#fff;--red:#c62828;--orange:#b45f00;--ok:#1f7a4d;--radius:14px;--shadow:0 1px 2px rgba(18,48,47,.07);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a1a;--card:#152626;--ink:#e6f2f1;--sub:#8fb0ae;--line:#2c4a49;--field:#4f7371;--main:#2bb5b0;--main-ink:#06201f;--red:#ff6b6b;--orange:#ffa94d;--ok:#51cf8f;--shadow:0 0 0 transparent}}
/* 테마(data-skin, 냉장고마다 공유). 민트=기본(위). 화이트는 다크 모드에서도 밝게. 대비는 WCAG AA 확인함 */
:root[data-skin=pink]{--bg:#fff0f6;--card:#fff;--ink:#3a0d25;--sub:#8c4569;--line:#f6d2e3;--field:#c06a94;--main:#d1127a;--main-ink:#fff;--shadow:0 1px 2px rgba(58,13,37,.08)}
:root[data-skin=purple]{--bg:#f5f0ff;--card:#fff;--ink:#22113f;--sub:#6a5a8c;--line:#e3d9fa;--field:#8f7bbf;--main:#6d28d9;--main-ink:#fff;--shadow:0 1px 2px rgba(34,17,63,.08)}
:root[data-skin=blue]{--bg:#eff5ff;--card:#fff;--ink:#0b1f3f;--sub:#4f6386;--line:#d6e4fb;--field:#7189b3;--main:#1d5fd6;--main-ink:#fff;--shadow:0 1px 2px rgba(11,31,63,.08)}
:root[data-skin=white]{--bg:#fafafa;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--field:#8e8e93;--main:#1d1d1f;--main-ink:#fff;--red:#c62828;--orange:#b45f00;--ok:#1f7a4d;--shadow:0 1px 2px rgba(0,0,0,.06);color-scheme:light}
@media(prefers-color-scheme:dark){
  :root[data-skin=pink]:not([data-theme=light]){--bg:#1c0b14;--card:#2a1220;--ink:#ffe6f2;--sub:#e3a3c3;--line:#4d2238;--field:#9a5b7b;--main:#ff63b1;--main-ink:#2a0617;--shadow:0 0 0 transparent}
  :root[data-skin=purple]:not([data-theme=light]){--bg:#120b22;--card:#1d1433;--ink:#efe8ff;--sub:#b3a3d9;--line:#352a55;--field:#6e5f99;--main:#a78bfa;--main-ink:#1a0d33;--shadow:0 0 0 transparent}
  :root[data-skin=blue]:not([data-theme=light]){--bg:#0a1222;--card:#111d33;--ink:#e6efff;--sub:#9fb3d6;--line:#26385a;--field:#5b7299;--main:#5b9dff;--main-ink:#08172e;--shadow:0 0 0 transparent}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:12px 16px 8px;padding-top:calc(12px + env(safe-area-inset-top));max-width:560px;margin:0 auto}
header svg{width:36px;height:36px;flex:none}
header h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.gear{background:transparent;color:var(--main);font-size:22px;padding:6px 10px;min-width:44px;border-radius:50%}
main{padding:0 16px;max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid transparent;border-radius:10px;padding:10px 16px;background:var(--main);color:var(--main-ink);font-weight:600;min-height:44px;transition:filter .1s,background-color .1s}
button:active{filter:brightness(.92)}
button.ghost{background:transparent;color:var(--main);border-color:var(--main)}
button.danger{background:transparent;color:var(--red);border-color:var(--line)}
button.x{border-color:transparent;color:var(--sub)}
.actions .ghost{color:var(--ink);border-color:var(--field)}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--field);border-radius:10px;background:var(--bg);min-height:44px}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
input[type=checkbox]{padding:0;accent-color:var(--main)}
input::placeholder{color:var(--sub);opacity:1}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible,.item:focus-visible{outline:2px solid var(--main);outline-offset:2px}
input:focus-visible,select:focus-visible{border-color:var(--main)}
input.bad{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
input.bad:focus-visible{outline-color:var(--red)}
label{display:block;font-size:14px;font-weight:600;color:var(--sub);margin:14px 0 4px}
dialog label{margin:10px 0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.entry{border-color:var(--field)}
form.card button[type=submit]{min-width:72px}
.row{display:flex;align-items:center;gap:8px}
.row>.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--sub)}
.badge{flex:none;font-weight:700;font-size:14px;line-height:1.3;padding:3px 10px;border-radius:999px;border:1.5px solid var(--ok);color:var(--ok);white-space:nowrap}
.badge.red{border-color:var(--red);color:var(--red)}
.badge.expired{border-color:var(--red);background:var(--red);color:var(--card)}
.badge.orange{border-color:var(--orange);color:var(--orange)}
.badge.none{border-color:var(--line);color:var(--sub)}
.zone h2{font-size:13px;font-weight:700;letter-spacing:.06em;margin:0 0 4px;padding-bottom:8px;border-bottom:2px solid var(--line);color:var(--sub);display:flex;align-items:center;justify-content:space-between}
.zone h2 span:last-child{min-width:24px;padding:0 8px;border-radius:999px;background:var(--bg);text-align:center;font-size:12px;letter-spacing:0}
.item{display:flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;margin:0 -16px;border-top:1px solid var(--line);cursor:pointer;box-shadow:inset 3px 0 0 transparent}
.item:active{background:var(--bg)}
.item.red,.item.expired{box-shadow:inset 3px 0 0 var(--red)}
.item.orange{box-shadow:inset 3px 0 0 var(--orange)}
.zone h2+.item,.card>.item:first-child{border-top:0}
.zone>.meta{padding:8px 0 2px}
.chip{flex:none;padding:8px 12px;min-height:44px;font-size:14px;background:var(--card);color:var(--main);border-color:var(--field);white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:32px 16px;line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;border:0;background:transparent;color:var(--sub);min-height:56px;font-size:16px}
nav button:focus-visible{outline-offset:-4px}
nav button.on{color:var(--main);font-weight:800;box-shadow:inset 0 3px 0 var(--main)}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);width:min(92vw,440px);max-height:90vh;max-height:90dvh;overflow:auto;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:20px}
dialog h3{margin:20px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--sub)}
dialog details{border-top:1px solid var(--line);padding-top:4px}
dialog summary{min-height:44px}
.actions{display:flex;gap:8px;margin-top:20px}
.actions>*{flex:1}
.actions>[type=submit]{flex:1.5}
.actions.stick{position:sticky;bottom:0;background:var(--card);padding:12px 0;z-index:1}
.msg{margin-top:8px}
.msg:empty{margin:0}
.actions+.actions{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.note{font-size:14px;line-height:1.55;color:var(--sub);background:var(--card);border:1px dashed var(--field);border-radius:var(--radius);padding:12px 14px;margin:12px 0}
dialog .note{background:var(--bg)}
.note div+div{margin-top:4px}
.sugg{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{font-size:15px;color:var(--ink)}
main>div>.sugg{margin:-2px 0 8px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs .seg{flex:1 1 0;min-width:56px;min-height:44px;padding:8px 10px;background:var(--card);color:var(--ink);border:1.5px solid var(--field);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs .seg.on{background:var(--main);color:var(--main-ink);border-color:var(--main)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1.5px var(--field)}
#kDlg{width:100%;max-width:none;height:100%;max-height:none;margin:0;border:0;border-radius:0;padding:24px 20px;box-shadow:none}
#kDlg[open]{display:flex;align-items:center;justify-content:center}
#kDlg::backdrop{background:var(--bg)}
.gate{width:100%;max-width:420px;text-align:center}
.gate h2{font-size:26px;margin:0 0 12px}
.gate p{font-size:17px;line-height:1.6;margin:0 0 10px}
.gate strong{color:var(--red)}
.gate .big{width:100%;min-height:60px;font-size:19px;margin-top:20px}
.gate .ghost{width:100%;margin-top:12px}
button.done{flex:none;padding:3px 10px;min-height:30px;font-size:13px;border-width:1px;border-radius:8px}
.hide{display:none!important}
.err{font-size:14px;color:var(--red);margin-top:4px}
.err:empty{display:none}
#notice{width:calc(100% - 32px);max-width:528px;margin:8px auto;border:1px solid var(--line);border-left:4px solid var(--orange);background:var(--card);color:var(--ink)}
.meta a{display:inline-block;font-size:14px;line-height:24px;min-height:44px;margin:-12px 0;text-decoration:underline;text-underline-offset:3px}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0e8a86"/><rect x="16" y="10" width="32" height="44" rx="5" fill="#fff"/><rect x="17" y="31" width="30" height="2.4" fill="#0e8a86"/><rect x="20" y="38" width="4" height="10" rx="2" fill="#0f4c4a"/><rect x="20" y="17" width="4" height="12" rx="2" fill="#0f4c4a"/></svg>
  <h1 id="title"></h1>
  <button class="gear" id="gear" aria-label="설정">⚙︎</button>
</header>
<div id="notice" class="note hide" role="alert"></div>
<main id="app"></main>
<nav id="nav">
  <button data-tab="fridge" id="tabFridge"></button>
  <button data-tab="shop" id="tabShop"></button>
</nav>

<!-- 재료 수정 -->
<dialog id="eDlg">
  <form id="eForm">
    <h2>수정</h2>

<script>
// <core>
// 날짜·상태 계산 + 암호화 코어. 브라우저/Node 공통.
// 날짜 입력 파싱 → "YYYY-MM-DD" / ""(빈 입력) / null(형식 오류). 261020, 20261020, 26-10-20, 1020(월일) 허용.
function parseDate(text, kind = "exp", now = new Date()) {
  const t = String(text ?? "").trim();
  if (!t) return "";
  if (!/^[\d.\-\/\s]+$/.test(t)) return null;
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  let y, m, d;
  const parts = t.split(/[.\-\/\s]+/).filter(Boolean);
  if (/\D/.test(t) && parts.length >= 2) {
    if (parts.length === 3) [y, m, d] = parts; else if (parts.length === 2) [m, d] = parts; else return null;
    y = y === undefined ? undefined : y.length <= 2 ? 2000 + +y : y.length === 4 ? +y : NaN;
  } else {
    const s = t.replace(/\D/g, "");
    if (s.length === 6) [y, m, d] = [2000 + +s.slice(0, 2), s.slice(2, 4), s.slice(4)];
    else if (s.length === 8) [y, m, d] = [+s.slice(0, 4), s.slice(4, 6), s.slice(6)];
    else if (s.length === 4) [m, d] = [s.slice(0, 2), s.slice(2)];
    else return null;
  }
  m = +m; d = +d;
  const mk = yy => Date.UTC(yy, m - 1, d);
  const valid = yy => { const dt = new Date(mk(yy)); return dt.getUTCFullYear() === yy && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d; };
  if (y === undefined) {
    // 월일만 입력: 유통기한은 오늘 이후 첫 유효일(지났으면 내년…), 기준일은 오늘 이전 가장 가까운 유효일. 윤일(0229)을 위해 최대 8년 탐색
    const cook = kind === "cook";
    for (let i = 0; i <= 8 && y === undefined; i++) {
      const yy = now.getFullYear() + (cook ? -i : i);
      if (valid(yy) && (cook ? mk(yy) <= today : mk(yy) >= today)) y = yy;
    }
    if (y === undefined) return null;
  }
  if (!(y >= 2000 && y <= 2099) || !valid(y)) return null;
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

// 날짜까지 남은 일수(오늘=0, 지남=음수). 날짜 없으면 null.
function daysLeft(date, now = new Date()) {
  if (!date) return null;
  const [y, m, d] = date.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
}

// 표시 문구·단계(level)·정렬키(key, 작을수록 급함). kind: "exp"=유통기한, "cook"=기준일(그날부터 며칠 지났나, 4일 지나면 위험).
function status(it, now = new Date()) {
  const n = daysLeft(it.date, now);
  if (n === null) return { label: "", level: "none", key: 1e9 };
  if (it.kind === "cook") {
    const e = Math.max(0, -n);
    return { label: e === 0 ? "오늘" : `${e}일 경과`, level: e >= 4 ? "red" : e >= 3 ? "orange" : "ok", key: 4 - e };
  }
  return { label: n < 0 ? `${-n}일 지남` : n === 0 ? "오늘까지" : `D-${n}`, level: n < 0 ? "expired" : n <= 3 ? "red" : n <= 7 ? "orange" : "ok", key: n };
}
const byUrgency = (a, b) => status(a).key - status(b).key || a.name.localeCompare(b.name, "ko");
const fmtDate = d => d ? d.slice(2).replace(/-/g, "") : "";   // 2026-10-20 → 261020

// 자동완성: words = { 이름: 쓴 횟수 } (Object.create(null)).
// 초성 검색: "ㄷ" → 대파·두부, "ㄷㅍ" → 대파. 입력 중인 마지막 글자 "다"(받침 전)도 "닭"에 맞는다.
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const syl = ch => { const c = ch.charCodeAt(0) - 0xac00; return c >= 0 && c <= 11171 ? c : -1; };   // 한글 음절 번호(아니면 -1)
function charMatch(q, w, last) {
  if (q === w) return true;
  const c = syl(w);
  if (c < 0) return false;
  if (CHO.includes(q)) return CHO[Math.floor(c / 588)] === q;
  const d = syl(q);
  return last && d >= 0 && d % 28 === 0 && Math.floor(d / 28) === Math.floor(c / 28);   // 받침 없는 입력 중 글자 = 초성·중성 같음
}
function matchPos(w, q) {   // q 가 w 의 몇 번째 글자부터 맞는지(없으면 -1)
  const wa = [...w], qa = [...q];
  for (let i = 0; i + qa.length <= wa.length; i++)
    if (qa.every((ch, j) => charMatch(ch, wa[i + j], j === qa.length - 1))) return i;
  return -1;
}
// 맞는 이름을 앞글자부터 맞는 것 → 중간에 맞는 것 순, 같은 무리는 많이 쓴 순. q 와 똑같은 이름·except 는 뺀다
function suggest(words, q = "", limit = 12, except = []) {
  q = q.trim().toLowerCase();
  return Object.keys(words).map(w => [w, q ? matchPos(w.toLowerCase(), q) : 0])
    .filter(([w, p]) => p >= 0 && w.toLowerCase() !== q && !except.includes(w))
    .sort((a, b) => (a[1] > 0) - (b[1] > 0) || words[b[0]] - words[a[0]] || a[0].localeCompare(b[0], "ko"))
    .slice(0, limit).map(([w]) => w);
}
function bumpWord(words, name, max = 200) {   // 횟수 +1, max 개를 넘으면 가장 적게 쓴 것부터 버린다(방금 쓴 이름은 남김)
  words[name] = (words[name] || 0) + 1;
  const extra = Object.keys(words).length - max;
  if (extra > 0) Object.keys(words).filter(k => k !== name).sort((a, b) => words[a] - words[b]).slice(0, extra).forEach(k => delete words[k]);
  return words;
}

// 공유용 암호화(WebCrypto). 키는 코드에 없고 사용자 폰에서 새로 만든다. 서버에는 암호문만 간다.
const bytesToB64u = b => { let s = ""; for (const v of new Uint8Array(b)) s += String.fromCharCode(v); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };

const newKey = () => bytesToB64u(crypto.getRandomValues(new Uint8Array(32)));
async function derive(key) {   // 키 → roomId(서버 주소, 키와 무관해 보이는 값) + aes(암호화 열쇠)
  const raw = b64uToBytes(key);
  if (raw.length !== 32) throw new Error("bad key");
  const base = await crypto.subtle.importKey("raw", raw, "HKDF", false, ["deriveBits", "deriveKey"]);
  const p = info => ({ name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: new TextEncoder().encode(info) });
  const roomId = [...new Uint8Array(await crypto.subtle.deriveBits(p("fridgey/room"), base, 256))].map(v => v.toString(16).padStart(2, "0")).join("");
  const aes = await crypto.subtle.deriveKey(p("fridgey/aes"), base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  return { roomId, aes };
}
async function encrypt(aes, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, new TextEncoder().encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return bytesToB64u(out);
}
async function decrypt(aes, str) {   // 키가 틀리거나 내용이 바뀌었으면 던진다 = '키가 맞는지' 검사
  const b = b64uToBytes(str);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, aes, b.slice(12))));
}
const keyFileText = key => JSON.stringify({ app: "fridgey", v: 1, key }, null, 2);
function parseKeyFile(text) {
  let o; try { o = JSON.parse(text); } catch { throw new Error("키 파일이 아닙니다"); }
  if (!o || o.app !== "fridgey" || o.v !== 1 || typeof o.key !== "string") throw new Error("Fridgey 키 파일이 아닙니다");
  let n = 0; try { n = b64uToBytes(o.key).length; } catch {}
  if (n !== 32) throw new Error("키 형식이 올바르지 않습니다");
  return o.key;
}
// </core>

// ---- 데이터 ----
const DEFAULT_LABELS = { title: "Fridgey", tabFridge: "냉장고", tabShop: "장보기", fName: "음식명", fDate: "유통기한", fCook: "기준일", fQty: "수량", addBtn: "추가", tabBin: "음쓰통", doneBtn: "처리" };
const LABEL_HELP = { title: "앱 이름", tabFridge: "첫 번째 탭 이름", tabShop: "두 번째 탭 이름", fName: "음식 입력칸 이름", fDate: "유통기한 입력칸 이름", fCook: "기준일 입력칸 이름", fQty: "수량 입력칸 이름", addBtn: "추가 버튼 이름", tabBin: "음쓰통 이름 (설정 안)", doneBtn: "처리 버튼 이름" };
const DEFAULT_ZONES = ["1층", "2층", "3층"];
const LS = "fridgey.data";
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } },
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const qty = v => String(v ?? "").trim().slice(0, 20) || "1";
const MAX_ZONES = 20, MAX_ROWS = 300, MAX_WORDS = 200, MAX_BIN = 100;   // 재료·장보기 각각. 한글 40자 이름이 꽉 차도 암호문이 서버 한도(256KB, supabase.sql)를 넘지 않는 크기

function normalize(d) {
  const o = { labels: {}, zones: [], items: [], shop: [] };
  d = d && typeof d === "object" ? d : {};
  for (const k in DEFAULT_LABELS) if (typeof d.labels?.[k] === "string") o.labels[k] = d.labels[k].slice(0, 20);
  for (const z of Array.isArray(d.zones) ? d.zones : []) if (z && z.id && typeof z.name === "string" && o.zones.length < MAX_ZONES && !o.zones.some(x => x.id === String(z.id))) o.zones.push({ id: String(z.id), name: z.name.slice(0, 20) });
  if (!o.zones.length) o.zones = DEFAULT_ZONES.map((name, i) => ({ id: "z" + (i + 1), name }));
  for (const i of Array.isArray(d.items) ? d.items : []) {
    if (!i || typeof i.name !== "string" || !i.name.trim() || o.items.length >= MAX_ROWS) continue;
    o.items.push({ id: String(i.id || uid()), name: i.name.slice(0, 40), qty: qty(i.qty),
      zone: o.zones.some(z => z.id === String(i.zone)) ? String(i.zone) : o.zones[0].id,
      date: typeof i.date === "string" && parseDate(i.date) === i.date ? i.date : "", kind: i.kind === "cook" ? "cook" : "exp" });
  }
  for (const s of Array.isArray(d.shop) ? d.shop : []) {
    if (!s || typeof s.name !== "string" || !s.name.trim() || o.shop.length >= MAX_ROWS) continue;
    o.shop.push({ id: String(s.id || uid()), name: s.name.slice(0, 40), qty: qty(s.qty), done: !!s.done });
  }
  o.bin = [];   // 음쓰통: 처리한 재료(최근 것부터, 최대 MAX_BIN). 되돌리기로 냉장고에 복구
  for (const i of Array.isArray(d.bin) ? d.bin : []) {
    if (!i || typeof i.name !== "string" || !i.name.trim() || o.bin.length >= MAX_BIN) continue;
    const ok = v => typeof v === "string" && parseDate(v) === v;
    o.bin.push({ id: String(i.id || uid()), name: i.name.slice(0, 40), qty: qty(i.qty), zone: String(i.zone ?? ""), date: ok(i.date) ? i.date : "", kind: i.kind === "cook" ? "cook" : "exp", binAt: ok(i.binAt) ? i.binAt : "" });
  }
  o.theme = ["mint", "pink", "white", "purple", "blue"].includes(d.theme) ? d.theme : "mint";   // 테마(냉장고마다 공유). 목록은 <head>의 SKINS 와 같게
  o.words = Object.create(null);   // 자동완성(이 냉장고에서 쓴 이름과 횟수). __proto__ 같은 이름도 안전하게
  Object.entries(d.words && typeof d.words === "object" ? d.words : {})
    .filter(([k, n]) => k.trim() && k.length <= 40 && Number.isInteger(n) && n > 0)
    .sort((a, b) => b[1] - a[1]).slice(0, MAX_WORDS).forEach(([k, n]) => { o.words[k] = Math.min(n, 1e6); });
  if (!d.words) [...o.items, ...o.shop].forEach(i => bumpWord(o.words, i.name, MAX_WORDS));   // 자동완성 이전 데이터: 지금 있는 이름으로 시작
  return o;
}

const $ = id => document.getElementById(id);
const showNotice = msg => { $("notice").textContent = msg; $("notice").classList.remove("hide"); };
const rawData = store.get(LS);
let data;
try { data = normalize(JSON.parse(rawData)); } catch { data = normalize(null); if (rawData) { store.set("fridgey.corrupt", rawData); showNotice("저장된 데이터를 읽지 못해 새로 시작했어요. 원본은 이 기기에 따로 남겨 뒀어요."); } }
let pref = {}; try { pref = JSON.parse(store.get("fridgey.pref")) || {}; } catch {}
let tab = "fridge", kind = pref.kind === "cook" ? "cook" : "exp", zoneId = data.zones.some(z => z.id === pref.zone) ? pref.zone : data.zones[0].id, editing = null;
const savePref = () => store.set("fridgey.pref", JSON.stringify({ zone: zoneId, kind }));
const reveal = el => setTimeout(() => el.scrollIntoView({ block: "center" }), 250);

const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in props) /^(aria-|role$)/.test(k) ? e.setAttribute(k, props[k]) : (e[k] = props[k]);
  for (const k of kids.flat(Infinity)) e.append(k);
  return e;
};
const fillTo = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity));   // 목록(배열)이 섞여 있어도 풀어서 넣는다
const L = k => data.labels[k]?.trim() || DEFAULT_LABELS[k];
let saveFailed = false;
// ---- 공유(동기화): 키로 암호화한 데이터 1덩어리를 Supabase 에 맡긴다. supabase.sql 먼저 실행하고 아래 두 값을 채운다. ----
const SYNC = { url: "https://unpfcmdbdcpstsdnatud.supabase.co", anon: "sb_publishable_v6QdtRd2q62-1zplFR6uzw_LL_WppI8" };   // Project URL / anon public key (공개 키). 비어 있으면 공유 기능은 숨겨진다. service_role 키는 절대 넣지 말 것.
const syncOn = () => !!(SYNC.url && SYNC.anon);
let sync = null, synced = "", dirty = false, busy = false, pushTimer, syncStatus = "";   // sync = { key, id, aes, rev }
const saveSync = () => store.set("fridgey.sync", JSON.stringify({ key: sync.key, rev: sync.rev }));
async function rpc(fn, args) {
  // 새 형식 공개 키(sb_publishable_…)는 JWT가 아니라서 apikey 헤더만 보낸다(예전 eyJ… 키만 Authorization 도 보냄)
  const r = await fetch(`${SYNC.url}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: SYNC.anon, ...(SYNC.anon.startsWith("eyJ") && { Authorization: `Bearer ${SYNC.anon}` }), "Content-Type": "application/json" }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
const save = () => {
  if (!store.set(LS, JSON.stringify(data)) && !saveFailed) { saveFailed = true; showNotice("이 기기에 저장하지 못했어요. 설정에서 데이터를 내보내 백업해 두세요."); }
  if (sync && JSON.stringify(data) !== synced) { dirty = true; clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 800); }
};
async function readRoom() {   // 서버 행 → { data, rev } (없으면 null). 키가 틀리면 decrypt 가 던진다.
  const row = await rpc("get_room", { p_id: sync.id });
  return row ? { data: normalize(await decrypt(sync.aes, row.blob)), rev: row.rev } : null;
}
function adopt(room) {   // 서버 내용으로 이 기기를 맞춘다
  data = room.data; sync.rev = room.rev; synced = JSON.stringify(data);
  store.set(LS, JSON.stringify(data)); saveSync();
  if (!data.zones.some(z => z.id === zoneId)) zoneId = data.zones[0].id;
}
async function syncNow() {
  if (!sync || busy) return;
  busy = true; clearTimeout(pushTimer);
  const wasDirty = dirty; dirty = false;
  let failed = false;
  try {
    if (wasDirty) {
      const snap = JSON.stringify(data);   // 전송하는 내용(보내는 동안 더 바뀌면 dirty 가 다시 켜져 다음에 또 보낸다)
      const res = await rpc("put_room", { p_id: sync.id, p_blob: await encrypt(sync.aes, data), p_rev: sync.rev });
      if (res < 0) {   // 다른 기기가 먼저 저장함 → 서버 내용으로 교체(마지막 저장 우선)
        const room = await readRoom();
        if (room) { dirty = false; document.querySelectorAll("dialog[open]:not(#kDlg)").forEach(d => d.close()); adopt(room); render(); showNotice("다른 기기에서 먼저 바뀌어서 최신 내용으로 불러왔어요. 방금 한 변경이 안 보이면 다시 입력해 주세요."); }
        else { sync.rev = 0; dirty = true; }   // 서버 행이 사라짐 → 다음에 다시 만든다
      } else { sync.rev = res; synced = snap; saveSync(); }
    } else {
      const room = await readRoom();
      if (!room) { sync.rev = 0; dirty = true; }
      else if (room.rev !== sync.rev && !document.querySelector("dialog[open]")) { adopt(room); render(); }   // 대화상자가 열려 있으면 닫힌 뒤 다음 주기에
    }
    syncStatus = "동기화됨 " + new Date().toTimeString().slice(0, 5);
  } catch { failed = true; dirty = dirty || wasDirty; syncStatus = "연결되지 않아요. 연결되면 다시 맞춰요."; }

  editing = it;
  $("eName").value = it.name; $("eDate").value = fmtDate(it.date); $("eDate").classList.remove("bad"); $("eErr").textContent = "";
  $("eKind").value = it.kind; $("eQty").value = it.qty; fillZones($("eZone"), it.zone);
  openDlg($("eDlg")); $("eCancel").focus();   // 폰 키보드가 바로 뜨지 않게
}
$("eDate").oninput = () => { $("eDate").classList.remove("bad"); $("eErr").textContent = ""; };
$("eForm").onsubmit = e => {
  e.preventDefault();
  const name = $("eName").value.trim(), date = parseDate($("eDate").value, $("eKind").value);
  if (!name) return $("eName").focus();
  if (date === null) { $("eDate").classList.add("bad"); $("eErr").textContent = "날짜를 확인해 주세요. 예: 261020"; return $("eDate").focus(); }
  Object.assign(editing, { name, date, kind: $("eKind").value, qty: qty($("eQty").value), zone: $("eZone").value });
  save(); $("eDlg").close(); render();
};
$("eCancel").onclick = () => $("eDlg").close();
// ---- 처리(음쓰통으로) / 되돌리기 ----
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function restoreItem(it) {   // 음쓰통 → 냉장고(구역이 지워졌으면 첫 구역)
  data.bin = data.bin.filter(x => x !== it);
  const { binAt, ...back } = it;
  data.items.push({ ...back, zone: data.zones.some(z => z.id === it.zone) ? it.zone : data.zones[0].id });
  save();
}
let undoTimer;
function processItem(it) {   // 냉장고 → 음쓰통(최근 것이 위, 최대 MAX_BIN 개)
  data.items = data.items.filter(x => x !== it);
  const b = { ...it, binAt: todayISO() };
  data.bin = [b, ...data.bin].slice(0, MAX_BIN);
  save(); render();
  fb.msg.replaceChildren(`‘${it.name}’ ${L("tabBin")}으로(⚙에서 볼 수 있어요) · `, h("a", { href: "#", textContent: "되돌리기", style: "color:var(--main);font-weight:600;padding:10px 4px", onclick(e) { e.preventDefault(); if (data.bin.includes(b)) restoreItem(b); render(); } }));
  clearTimeout(undoTimer); undoTimer = setTimeout(() => { if (fb.msg.querySelector("a")) fb.msg.textContent = ""; }, 8000);
}
$("eDel").onclick = () => { const it = editing; $("eDlg").close(); processItem(it); };
function binSection() {   // 설정 안 음쓰통: 처리한 재료(최근 것부터), 되돌리기
  return h("details", { style: "margin-top:18px", open: binOpen, ontoggle() { binOpen = this.open; } },
    h("summary", { textContent: `${L("tabBin")} (${data.bin.length}개) — ${L("doneBtn")}한 재료, 되돌릴 수 있어요`, style: "cursor:pointer;font-size:16px;font-weight:600;color:var(--main);padding:10px 0" }),
    h("div", { className: "meta", textContent: `최근 ${MAX_BIN}개까지 보관돼요.`, style: "margin-bottom:6px" }),
    data.bin.length ? data.bin.map(b => h("div", { className: "row", style: "padding:8px 0;border-top:1px solid var(--line)" },
      h("div", { className: "grow" },
        h("div", { className: "name", textContent: b.name + (b.qty !== "1" ? ` ×${b.qty}` : "") }),
        h("div", { className: "meta", textContent: [zoneName(b.zone), b.date && `${kindLabel(b.kind)} ${fmtDate(b.date)}`, b.binAt && `${+b.binAt.slice(5, 7)}/${+b.binAt.slice(8)} ${L("doneBtn")}`].filter(Boolean).join(" · ") })),
      h("button", { className: "ghost done", textContent: "되돌리기", "aria-label": `${b.name} 되돌리기`, onclick() { restoreItem(b); renderSettings(); } })))
      : h("div", { className: "meta", textContent: `아직 비어 있어요. ${L("tabFridge")}에서 ${L("doneBtn")}을 누르면 여기로 와요.` }));
}

// ---- 장보기 → 냉장고 ----
let moveRows = [];
function openMove() {
  fillZones($("mZone"), zoneId);
  moveRows = data.shop.filter(s => s.done).map(s => ({ s, date: h("input", { inputMode: "numeric", maxLength: 12, autocomplete: "off", placeholder: L("fDate") + " 예: 261020 (비워도 돼요)", "aria-label": s.name }) }));
  moveRows.forEach((r, i) => {
    r.date.oninput = () => { r.date.classList.remove("bad"); $("mErr").textContent = ""; };
    r.date.onfocus = () => reveal(r.date);
    r.date.onkeydown = e => { if (e.key === "Enter" && i < moveRows.length - 1) { e.preventDefault(); moveRows[i + 1].date.focus(); } };
  });
  $("mErr").textContent = "";
  $("mRows").replaceChildren(...moveRows.map(r => h("div", { style: "margin-top:10px" },
    h("div", { className: "name", textContent: r.s.name + (r.s.qty !== "1" ? ` ×${r.s.qty}` : "") }), r.date)));
  openDlg($("mDlg")); moveRows[0]?.date.focus();
}
$("mForm").onsubmit = e => {
  e.preventDefault();
  const dates = moveRows.map(r => parseDate(r.date.value, "exp"));
  if (dates.includes(null)) { const i = dates.indexOf(null); moveRows[i].date.classList.add("bad"); $("mErr").textContent = "날짜를 확인해 주세요. 예: 261020"; return moveRows[i].date.focus(); }
  if (data.items.length + moveRows.length > MAX_ROWS) { $("mErr").textContent = `재료는 최대 ${MAX_ROWS}개까지예요. 다 먹은 것을 정리해 주세요.`; return; }
  zoneId = $("mZone").value; savePref();
  moveRows.forEach((r, i) => data.items.push({ id: uid(), name: r.s.name, qty: r.s.qty, zone: zoneId, date: dates[i], kind: "exp" }));
  const moved = new Set(moveRows.map(r => r.s)); data.shop = data.shop.filter(s => !moved.has(s));
  save(); $("mDlg").close(); tab = "fridge"; render();
};
$("mCancel").onclick = () => $("mDlg").close();

// ---- 설정 ----
let wordsOpen = false, binOpen = false;
function openSettings() { renderSettings(); openDlg($("sDlg")); }
const BAD_FILE = "이 파일은 Fridgey에서 내보낸 데이터가 아닌 것 같아요. '데이터 내보내기'로 저장한 .json 파일을 골라 주세요.";
function renderSettings() {
  const file = h("input", { type: "file", accept: ".json,application/json", className: "hide" });
  file.onchange = async () => {
    try {
      const raw = JSON.parse(await file.files[0].text());
      if (!raw || typeof raw !== "object" || !["items", "shop", "zones"].some(k => Array.isArray(raw[k]))) return alert(BAD_FILE);
      const d = normalize(raw);
      if (!confirm(`지금 데이터를 파일 내용으로 바꿔요. (재료 ${d.items.length}개, 장보기 ${d.shop.length}개) 계속할까요?`)) return;
      data = d; save(); zoneId = data.zones[0].id; renderSettings(); render();
    } catch { alert(BAD_FILE); } finally { file.value = ""; }
  };
  const keyFile = h("input", { type: "file", accept: ".json,application/json", className: "hide" });
  keyFile.onchange = async () => { try { await joinRoom(await keyFile.files[0].text()); } finally { keyFile.value = ""; renderSettings(); render(); } };
  fillTo($("sBody"),
    h("h3", { textContent: "구역 (층)" }),
    data.zones.map(z => h("div", { className: "row", style: "margin-bottom:8px" },
      h("input", { value: z.name, maxLength: 20, "aria-label": "구역 이름", oninput() { z.name = this.value; save(); }, onblur() { if (!z.name.trim()) { z.name = "구역"; this.value = z.name; save(); } } }),
      h("button", { className: "danger", textContent: "✕", "aria-label": `${z.name} 구역 삭제`, style: "padding:8px 12px;min-width:44px", onclick() { delZone(z); } }))),
    h("button", { className: "ghost", textContent: "＋ 구역 추가", style: "width:100%", onclick() { data.zones.push({ id: uid(), name: `${data.zones.length + 1}층` }); save(); renderSettings(); } }),
    h("h3", { textContent: "테마 (함께 쓰는 사람과 공유돼요)" }),
    h("div", { className: "segs", role: "group", "aria-label": "테마" }, Object.keys(SKINS).map(s => h("button", {
      type: "button", className: "seg" + (data.theme === s ? " on" : ""), "aria-pressed": String(data.theme === s),
      onclick() { data.theme = s; save(); applySkin(s); renderSettings(); },
    }, h("span", { className: "dot", style: `background:${SKINS[s][1]}` }), SKINS[s][0]))),
    syncOn() ? [
      h("h3", { textContent: "공유 (가족과 함께 쓰기)" }),
      sync ? [
        h("div", { className: "note", textContent: `공유 중이에요. ${syncStatus || "곧 동기화돼요."}` }),
        h("button", { className: "ghost", textContent: "키 파일 보관하기 (카톡 나에게 보내기 등)", style: "width:100%", onclick: shareKey }),
        h("button", { className: "danger", textContent: "이 기기에서 공유 끊기", style: "width:100%;margin-top:8px", onclick() {
          if (confirm("이 기기에서 공유를 끊어요. (데이터는 이 기기에 남아요.) 키 파일이 없으면 다시 참여할 수 없어요. 계속할까요?")) { leaveRoom(); renderSettings(); render(); }
        } })]
      : [
        h("div", { className: "note", textContent: "키 파일을 가진 사람끼리 같은 냉장고를 함께 써요. 데이터는 키로 암호화돼서 서버에는 읽을 수 없는 글자만 저장돼요. 키 파일을 잃어버리면 복구할 수 없어요." }),
        h("button", { textContent: "공유 냉장고 만들기", style: "width:100%", onclick: async () => { await createRoom(); renderSettings(); render(); } }),
        h("button", { className: "ghost", textContent: "키 파일로 참여하기", style: "width:100%;margin-top:8px", onclick: () => keyFile.click() }), keyFile]] : "",
    h("h3", { textContent: "데이터" }),
    h("div", { className: "note" },
      h("div", { textContent: sync ? "① 공유 중이라 데이터가 암호화돼서 서버에도 저장돼요. 이 기기에도 복사본이 있어요." : "① 데이터는 이 기기 브라우저에만 저장돼요. 사이트 데이터를 지우면 사라져요." }),
      h("div", { textContent: "② 가족과 나누려면 '내보내기'로 만든 파일을 카톡·메일로 보내고, 받는 사람이 '불러오기'를 해요. (받는 사람 기기의 기존 데이터는 바뀌어요.)" }),
      h("div", { textContent: "③ 가끔 내보내기로 백업해 두세요." }),
      h("div", { textContent: "홈 화면에 추가하면 앱처럼 바로 열려요: 공유 → 홈 화면에 추가", style: "margin-top:8px" })),
    h("button", { className: "ghost", textContent: "데이터 내보내기 (파일 저장)", style: "width:100%", onclick: () => download("fridgey-data.json", JSON.stringify(data, null, 2)) }),
    h("button", { className: "ghost", textContent: "데이터 불러오기", style: "width:100%;margin-top:8px", onclick: () => file.click() }), file,
    h("h3", { textContent: "도움말" }),
    h("div", { className: "meta", textContent: guideState() }),
    h("button", { className: "ghost", textContent: "설명 보기", style: "width:100%;margin-top:8px", onclick: () => openGuide(true) }),
    guideHidden() ? h("button", { className: "ghost", textContent: "시작할 때 다시 보이기", style: "width:100%;margin-top:8px", onclick() { store.set(GUIDE, ""); renderSettings(); } }) : "",
    binSection(),
    h("details", { style: "margin-top:18px", open: wordsOpen, ontoggle() { wordsOpen = this.open; } },
      h("summary", { textContent: `자동완성 단어 (${Object.keys(data.words).length}개) — 잘못 들어간 건 ✕로 지워요`, style: "cursor:pointer;font-size:16px;font-weight:600;color:var(--main);padding:10px 0" }),
      Object.keys(data.words).length ? Object.keys(data.words).sort((a, b) => data.words[b] - data.words[a]).map(w => h("div", { className: "row", style: "margin-bottom:6px" },
        h("div", { className: "grow name", textContent: `${w} · ${data.words[w]}번` }),
        h("button", { className: "ghost x", textContent: "✕", "aria-label": `${w} 자동완성에서 지우기`, style: "padding:8px 12px;min-width:44px", onclick() { delete data.words[w]; save(); renderSettings(); } })))
        : h("div", { className: "meta", textContent: "재료나 장보기를 추가하면 여기에 쌓여요." })),
    h("details", { style: "margin-top:18px" },
      h("summary", { textContent: "이름 바꾸기 — 비워 두면 기본 이름이에요", style: "cursor:pointer;font-size:16px;font-weight:600;color:var(--main);padding:10px 0" }),
      Object.keys(DEFAULT_LABELS).map(k => h("div", {},
        h("label", { textContent: LABEL_HELP[k], htmlFor: "sl-" + k }),
        h("input", { id: "sl-" + k, value: data.labels[k] ?? "", placeholder: DEFAULT_LABELS[k], maxLength: 20, oninput() { data.labels[k] = this.value; save(); applyLabels(); } })))));
}
function delZone(z) {
  if (data.zones.length <= 1) return alert("구역은 최소 1개 있어야 해요.");
  const n = data.items.filter(i => i.zone === z.id).length;
  if (!confirm(n ? `"${z.name}"의 재료 ${n}개는 첫 번째 구역으로 옮겨져요. 삭제할까요?` : `"${z.name}"을(를) 삭제할까요?`)) return;
  data.zones = data.zones.filter(x => x !== z);
  data.items.forEach(i => { if (i.zone === z.id) i.zone = data.zones[0].id; });
  if (zoneId === z.id) { zoneId = data.zones[0].id; savePref(); }
  save(); renderSettings();
}
$("gear").onclick = openSettings;
$("sClose").onclick = () => $("sDlg").close();
$("sDlg").onclose = () => { data.zones.forEach(z => { if (!z.name.trim()) z.name = "구역"; }); save(); render(); };
document.onvisibilitychange = () => {
  if (document.hidden) return;
  if (day !== new Date().toDateString() && !document.querySelector("dialog[open]")) render();
  syncNow();
};
setInterval(() => { if (!document.hidden) syncNow(); }, 30000);
$("nav").onclick = e => { const t = e.target.closest("button")?.dataset.tab; if (t && t !== tab) { tab = t; history.pushState({ tab }, ""); render(); } };

// ---- 폰 뒤로가기: 열린 창이 있으면 닫고, 없으면 이전 탭으로. 키 보관 창·시작 안내는 고르기 전엔 안 닫힘 ----
let ignorePop = false, guideLocked = false;
function openDlg(d) { d.showModal(); history.pushState({ dlg: d.id, tab }, ""); }
for (const d of document.querySelectorAll("dialog"))   // 버튼으로 닫으면 쌓아 둔 뒤로가기 한 칸을 같이 지운다
  d.addEventListener("close", () => { if (history.state?.dlg === d.id) { ignorePop = true; history.back(); } });
window.onpopstate = e => {
  if (ignorePop) { ignorePop = false; return; }
  const open = [...document.querySelectorAll("dialog[open]")].pop();
  if (open) {
    if (open.id === "kDlg" || (open.id === "gDlg" && guideLocked)) history.pushState({ dlg: open.id, tab }, "");
    else open.close();
    return;
  }
  if (e.state?.tab && e.state.tab !== tab) { tab = e.state.tab; render(); }
};
history.replaceState({ tab }, "");

if (typeof window.HTMLDialogElement?.prototype.showModal !== "function" || !Element.prototype.replaceChildren) {
  document.body.textContent = "최신 브라우저에서 열어 주세요.";
} else {
  try { render(); } catch {
    if (rawData) store.set("fridgey.corrupt", rawData);
    data = normalize(null); zoneId = data.zones[0].id; showNotice("저장된 데이터에 문제가 있어 새로 시작했어요."); render();
  }
  try { navigator.storage?.persist?.(); } catch {}
  (async () => {
    if (syncOn()) try {
      const s = JSON.parse(store.get("fridgey.sync") || "null");
      if (s?.key) { await useKey(s.key, s.rev | 0); syncNow(); }
      else if (store.get("fridgey.noauto") !== "1") await autoRoom();   // 처음 켠 기기: 자동 백업 시작
    } catch {}
    await keyGate();   // 새 키면 먼저 보관하게(화면 전체)
    if (!guideHidden() && !document.querySelector("dialog[open]")) { render(); openGuide(false); }
  })();
}
</script>
</body>
</html>
