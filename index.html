<title>Fridgey</title>
<link rel="manifest" href="manifest.json">   <!-- 크롬 "앱 설치" 버튼용(manifest.json·icon-192/512.png 같이 배포) -->
<script>
// 테마는 화면이 그려지기 전에 적용한다(기본 테마가 잠깐 보였다가 바뀌지 않게). data.theme 과 같은 값을 fridgey.skin 에 따로 둔다.
var SKINS = { white: ["화이트", "#fafafa", "#fafafa", "#ffffff"], mint: ["민트", "#f0faf6", "#0d1a1a", "#bfe8d8"], pink: ["핑크", "#fff4f8", "#1c0b14", "#f8cfe0"], purple: ["퍼플", "#f7f3ff", "#120b22", "#ddd0f7"], blue: ["블루", "#f2f7ff", "#0a1222", "#c9dcfa"] };
function applySkin(s) {
  if (!Object.prototype.hasOwnProperty.call(SKINS, s)) s = "white";
  document.documentElement.dataset.skin = s;
  var m = document.querySelectorAll('meta[name="theme-color"]');   // 폰 상단 상태바 색
  if (m[0]) m[0].content = SKINS[s][1];
  if (m[1]) m[1].content = SKINS[s][2];
  try { localStorage.setItem("fridgey.skin", s); } catch (e) {}
}
(function () {
  var s = null;
  try { s = localStorage.getItem("fridgey.skin") || JSON.parse(localStorage.getItem("fridgey.data")).theme; } catch (e) {}
  applySkin(s);
})();
</script>

<style>
:root{--bg:#f0faf6;--card:#fff;--ink:#16332b;--sub:#4f6d64;--line:#d7efe6;--field:#679083;--main:#bfe8d8;--main-ink:#123a2e;--accent:#2c7a62;--red:#c62828;--orange:#b45f00;--ok:#1f7a4d;--radius:14px;--shadow:0 1px 2px rgba(22,51,43,.07);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a1a;--card:#152626;--ink:#e6f2f1;--sub:#8fb0ae;--line:#2c4a49;--field:#4f7371;--main:#9fdcc6;--main-ink:#0d2e24;--accent:#9fdcc6;--red:#ff6b6b;--orange:#ffa94d;--ok:#51cf8f;--shadow:0 0 0 transparent}}
/* 테마: 파스텔(냉장고마다 공유). 화이트=기본, 다크 모드에서도 밝게. 민트=:root 기본값.
   --main = 버튼·선택 면(파스텔), --main-ink = 그 위 글자, --accent = 글자·링크·테두리용 진한 색. 대비는 WCAG AA 확인함 */
:root[data-skin=white]{--bg:#fafafa;--card:#fff;--ink:#1f1f24;--sub:#66666e;--line:#ebebef;--field:#8c8c96;--main:#e8e6f0;--main-ink:#26242e;--accent:#4a4757;--red:#c62828;--orange:#b45f00;--ok:#1f7a4d;--shadow:0 1px 2px rgba(0,0,0,.06);color-scheme:light}
:root[data-skin=pink]{--bg:#fff4f8;--card:#fff;--ink:#3b1a28;--sub:#7d5466;--line:#f8dbe7;--field:#ad7390;--main:#f8cfe0;--main-ink:#4a1631;--accent:#a8406f;--shadow:0 1px 2px rgba(59,26,40,.07)}
:root[data-skin=purple]{--bg:#f7f3ff;--card:#fff;--ink:#26193f;--sub:#655a80;--line:#e6defa;--field:#887ab0;--main:#ddd0f7;--main-ink:#2e1a52;--accent:#6a4bb5;--shadow:0 1px 2px rgba(38,25,63,.07)}
:root[data-skin=blue]{--bg:#f2f7ff;--card:#fff;--ink:#13243f;--sub:#52627e;--line:#d9e6fa;--field:#6f88b3;--main:#c9dcfa;--main-ink:#10284d;--accent:#2f62b3;--shadow:0 1px 2px rgba(19,36,63,.07)}
@media(prefers-color-scheme:dark){
  :root[data-skin=pink]:not([data-theme=light]){--bg:#1c0b14;--card:#2a1220;--ink:#ffe6f2;--sub:#e3a3c3;--line:#4d2238;--field:#9a5b7b;--main:#f4a7c8;--main-ink:#3a0f24;--accent:#f4a7c8;--shadow:0 0 0 transparent}
  :root[data-skin=purple]:not([data-theme=light]){--bg:#120b22;--card:#1d1433;--ink:#efe8ff;--sub:#b3a3d9;--line:#352a55;--field:#6e5f99;--main:#c4b0f5;--main-ink:#24133f;--accent:#c4b0f5;--shadow:0 0 0 transparent}
  :root[data-skin=blue]:not([data-theme=light]){--bg:#0a1222;--card:#111d33;--ink:#e6efff;--sub:#9fb3d6;--line:#26385a;--field:#5b7299;--main:#a9c8fa;--main-ink:#0c2140;--accent:#a9c8fa;--shadow:0 0 0 transparent}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:12px 16px 8px;padding-top:calc(12px + env(safe-area-inset-top));max-width:560px;margin:0 auto}
header svg{width:36px;height:36px;flex:none}
header h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.gear{background:transparent;border-color:transparent;color:var(--accent);font-size:22px;padding:6px 10px;min-width:44px;border-radius:50%}
main{padding:0 16px;max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--accent);border-radius:10px;padding:10px 16px;background:var(--main);color:var(--main-ink);font-weight:600;min-height:44px;transition:filter .1s,background-color .1s}
button:active{filter:brightness(.92)}
button.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
button.danger{background:transparent;color:var(--red);border-color:var(--line)}
button.x{border-color:transparent;color:var(--sub)}
.actions .ghost{color:var(--ink);border-color:var(--field)}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--field);border-radius:10px;background:var(--bg);min-height:44px}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
input[type=checkbox]{padding:0;accent-color:var(--accent)}
input::placeholder{color:var(--sub);opacity:1}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,select:focus-visible{border-color:var(--accent)}
input.bad{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
input.bad:focus-visible{outline-color:var(--red)}
label{display:block;font-size:14px;font-weight:600;color:var(--sub);margin:14px 0 4px}
dialog label{margin:10px 0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.entry{border-color:var(--field)}
form.card button[type=submit]{min-width:72px}
.row{display:flex;align-items:center;gap:8px}
.row>.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--sub)}
.badge{flex:none;font-weight:700;font-size:14px;line-height:1.3;padding:3px 10px;border-radius:999px;border:1.5px solid var(--ok);color:var(--ok);white-space:nowrap}
.badge.red{border-color:var(--red);color:var(--red)}
.badge.expired{border-color:var(--red);background:var(--red);color:var(--card)}
.badge.orange{border-color:var(--orange);color:var(--orange)}
.badge.none{border-color:var(--line);color:var(--sub)}
.zone h2{font-size:13px;font-weight:700;letter-spacing:.06em;margin:0 0 4px;padding-bottom:8px;border-bottom:2px solid var(--line);color:var(--sub);display:flex;align-items:center;justify-content:space-between}
.zone h2 span:last-child{min-width:24px;padding:0 8px;border-radius:999px;background:var(--bg);text-align:center;font-size:12px;letter-spacing:0}
.item{display:flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;margin:0 -16px;border-top:1px solid var(--line);cursor:pointer;box-shadow:inset 3px 0 0 transparent}
.item:active{background:var(--bg)}
.item.red,.item.expired{box-shadow:inset 3px 0 0 var(--red)}
.item.orange{box-shadow:inset 3px 0 0 var(--orange)}
.zone h2+.item,.card>.item:first-child{border-top:0}
.zone>.meta{padding:8px 0 2px}
.chip{flex:none;padding:8px 12px;min-height:44px;font-size:14px;background:var(--card);color:var(--accent);border-color:var(--field);white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:32px 16px;line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;border:0;background:transparent;color:var(--sub);min-height:56px;font-size:16px}
nav button:focus-visible{outline-offset:-4px}
nav button.on{color:var(--accent);font-weight:800;box-shadow:inset 0 3px 0 var(--accent)}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);width:min(92vw,440px);max-height:90vh;max-height:90dvh;overflow:auto;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:20px}
dialog h3{margin:20px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--sub)}
dialog details{border-top:1px solid var(--line);padding-top:4px}
dialog summary{min-height:44px}
.actions{display:flex;gap:8px;margin-top:20px}
.actions>*{flex:1}
.actions>[type=submit]{flex:1.5}
.actions.stick{position:sticky;bottom:0;background:var(--card);padding:12px 0;z-index:1}
.msg{margin-top:8px}
.msg:empty{margin:0}
.actions+.actions{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.note{font-size:14px;line-height:1.55;color:var(--sub);background:var(--card);border:1px dashed var(--field);border-radius:var(--radius);padding:12px 14px;margin:12px 0}
dialog .note{background:var(--bg)}
.note div+div{margin-top:4px}
.sugg{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{font-size:15px;color:var(--ink)}
main>div>.sugg{margin:-2px 0 8px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs .seg{flex:1 1 0;min-width:56px;min-height:44px;padding:8px 10px;background:var(--card);color:var(--ink);border:1.5px solid var(--field);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs .seg.on{background:var(--main);color:var(--main-ink);border-color:var(--accent)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1.5px var(--field)}
#kDlg{width:100%;max-width:none;height:100%;max-height:none;margin:0;border:0;border-radius:0;padding:24px 20px;box-shadow:none}
#kDlg[open]{display:flex;align-items:center;justify-content:center}
#kDlg::backdrop{background:var(--bg)}
.gate{width:100%;max-width:420px;text-align:center}
.gate h2{font-size:26px;margin:0 0 12px}
.gate p{font-size:17px;line-height:1.6;margin:0 0 10px}
.gate strong{color:var(--red)}
.gate .big{width:100%;min-height:60px;font-size:19px;margin-top:20px}
.gate .ghost{width:100%;margin-top:12px}
button.done{flex:none;padding:3px 10px;min-height:30px;font-size:13px;border-width:1px;border-radius:8px}
.pill{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;font-size:12px;line-height:1.5;background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.hide{display:none!important}
.err{font-size:14px;color:var(--red);margin-top:4px}
.err:empty{display:none}
#notice{width:calc(100% - 32px);max-width:528px;margin:8px auto;border:1px solid var(--line);border-left:4px solid var(--orange);background:var(--card);color:var(--ink)}
.meta a{display:inline-block;font-size:14px;line-height:24px;min-height:44px;margin:-12px 0;text-decoration:underline;text-underline-offset:3px}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>

<header>

<dialog id="gDlg" aria-labelledby="gTitle">

<script>
// <core>
// 날짜·상태 계산 + 암호화 코어. 브라우저/Node 공통.
// 날짜 입력 파싱 → "YYYY-MM-DD" / ""(빈 입력) / null(형식 오류). 261020, 20261020, 26-10-20, 1020(월일) 허용.
function parseDate(text, kind = "exp", now = new Date()) {
  const t = String(text ?? "").trim();
  if (!t) return "";
  if (!/^[\d.\-\/\s]+$/.test(t)) return null;
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  let y, m, d;
  const parts = t.split(/[.\-\/\s]+/).filter(Boolean);
  if (/\D/.test(t) && parts.length >= 2) {
    if (parts.length === 3) [y, m, d] = parts; else if (parts.length === 2) [m, d] = parts; else return null;
    y = y === undefined ? undefined : y.length <= 2 ? 2000 + +y : y.length === 4 ? +y : NaN;
  } else {
    const s = t.replace(/\D/g, "");
    if (s.length === 6) [y, m, d] = [2000 + +s.slice(0, 2), s.slice(2, 4), s.slice(4)];
    else if (s.length === 8) [y, m, d] = [+s.slice(0, 4), s.slice(4, 6), s.slice(6)];
    else if (s.length === 4) [m, d] = [s.slice(0, 2), s.slice(2)];
    else return null;
  }
  m = +m; d = +d;
  const mk = yy => Date.UTC(yy, m - 1, d);
  const valid = yy => { const dt = new Date(mk(yy)); return dt.getUTCFullYear() === yy && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d; };
  if (y === undefined) {
    // 월일만 입력: 유통기한은 최근 30일 안에 지난 날짜면 올해(이미 지난 재료), 더 지났으면 내년…; 기준일은 오늘 이전 가장 가까운 유효일. 윤일(0229)을 위해 최대 8년 탐색
    const cook = kind === "cook";
    for (let i = 0; i <= 8 && y === undefined; i++) {
      const yy = now.getFullYear() + (cook ? -i : i);
      if (valid(yy) && (cook ? mk(yy) <= today : mk(yy) >= today - 30 * 864e5)) y = yy;
    }
    if (y === undefined) return null;
  }
  if (!(y >= 2000 && y <= 2099) || !valid(y)) return null;
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

// 날짜까지 남은 일수(오늘=0, 지남=음수). 날짜 없으면 null.
function daysLeft(date, now = new Date()) {
  if (!date) return null;
  const [y, m, d] = date.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
}

// 표시 문구·단계(level)·정렬키(key, 작을수록 급함). kind: "exp"=유통기한, "cook"=기준일(그날부터 며칠 지났나, 4일 지나면 위험).
function status(it, now = new Date(), lang = "ko") {   // lang: "ko" | "en" (표시 문구만 다름)
  const n = daysLeft(it.date, now), en = lang === "en";
  if (n === null) return { label: "", level: "none", key: 1e9 };
  if (it.kind === "cook") {
    const e = Math.max(0, -n);
    return { label: e === 0 ? (en ? "Today" : "오늘") : en ? `${e}d ago` : `${e}일 경과`, level: e >= 4 ? "red" : e >= 3 ? "orange" : "ok", key: 4 - e };
  }
  return { label: n < 0 ? (en ? `${-n}d over` : `${-n}일 지남`) : n === 0 ? (en ? "Today" : "오늘까지") : en ? `${n}d left` : `D-${n}`, level: n < 0 ? "expired" : n <= 3 ? "red" : n <= 7 ? "orange" : "ok", key: n };
}
const byUrgency = (a, b) => status(a).key - status(b).key || a.name.localeCompare(b.name, "ko");
const fmtDate = d => d ? d.slice(2).replace(/-/g, "") : "";   // 2026-10-20 → 261020
// 연도 없이 월일만 썼는지(1020, 10-20, 10.20) — 앱이 연도를 짐작한 경우
function yearGuessed(text) { const t = String(text ?? "").trim(); return /\D/.test(t) ? t.split(/[.\-\/\s]+/).filter(Boolean).length === 2 : t.length === 4; }

// 자동완성: words = { 이름: 쓴 횟수 } (Object.create(null)).
// 초성 검색: "ㄷ" → 대파·두부, "ㄷㅍ" → 대파. 입력 중인 마지막 글자 "다"(받침 전)도 "닭"에 맞는다.
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const syl = ch => { const c = ch.charCodeAt(0) - 0xac00; return c >= 0 && c <= 11171 ? c : -1; };   // 한글 음절 번호(아니면 -1)
function charMatch(q, w, last) {
  if (q === w) return true;
  const c = syl(w);
  if (c < 0) return false;
  if (CHO.includes(q)) return CHO[Math.floor(c / 588)] === q;
  const d = syl(q);
  return last && d >= 0 && d % 28 === 0 && Math.floor(d / 28) === Math.floor(c / 28);   // 받침 없는 입력 중 글자 = 초성·중성 같음
}
function matchPos(w, q) {   // q 가 w 의 몇 번째 글자부터 맞는지(없으면 -1)
  const wa = [...w], qa = [...q];
  for (let i = 0; i + qa.length <= wa.length; i++)
    if (qa.every((ch, j) => charMatch(ch, wa[i + j], j === qa.length - 1))) return i;
  return -1;
}
// 맞는 이름을 앞글자부터 맞는 것 → 중간에 맞는 것 순, 같은 무리는 많이 쓴 순. q 와 똑같은 이름·except 는 뺀다
function suggest(words, q = "", limit = 12, except = []) {
  q = q.trim().toLowerCase();
  return Object.keys(words).map(w => [w, q ? matchPos(w.toLowerCase(), q) : 0])
    .filter(([w, p]) => p >= 0 && w.toLowerCase() !== q && !except.includes(w))
    .sort((a, b) => (a[1] > 0) - (b[1] > 0) || words[b[0]] - words[a[0]] || a[0].localeCompare(b[0], "ko"))
    .slice(0, limit).map(([w]) => w);
}
function bumpWord(words, name, max = 200) {   // 횟수 +1, max 개를 넘으면 가장 적게 쓴 것부터 버린다(방금 쓴 이름은 남김)
  words[name] = (words[name] || 0) + 1;
  const extra = Object.keys(words).length - max;
  if (extra > 0) Object.keys(words).filter(k => k !== name).sort((a, b) => words[a] - words[b]).slice(0, extra).forEach(k => delete words[k]);
  return words;
}

// 공유용 암호화(WebCrypto). 키는 코드에 없고 사용자 폰에서 새로 만든다. 서버에는 암호문만 간다.
const bytesToB64u = b => { let s = ""; for (const v of new Uint8Array(b)) s += String.fromCharCode(v); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const b64uToBytes = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const newKey = () => bytesToB64u(crypto.getRandomValues(new Uint8Array(32)));
async function derive(key) {   // 키 → roomId(서버 주소, 키와 무관해 보이는 값) + aes(암호화 열쇠)
  const raw = b64uToBytes(key);
  if (raw.length !== 32) throw new Error("bad key");
  const base = await crypto.subtle.importKey("raw", raw, "HKDF", false, ["deriveBits", "deriveKey"]);
  const p = info => ({ name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: new TextEncoder().encode(info) });
  const roomId = [...new Uint8Array(await crypto.subtle.deriveBits(p("fridgey/room"), base, 256))].map(v => v.toString(16).padStart(2, "0")).join("");
  const aes = await crypto.subtle.deriveKey(p("fridgey/aes"), base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  return { roomId, aes };
}
async function encrypt(aes, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, new TextEncoder().encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return bytesToB64u(out);
}
async function decrypt(aes, str) {   // 키가 틀리거나 내용이 바뀌었으면 던진다 = '키가 맞는지' 검사
  const b = b64uToBytes(str);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, aes, b.slice(12))));
}
const keyFileText = key => JSON.stringify({ app: "fridgey", v: 1, key }, null, 2);
function parseKeyFile(text) {
  let o; try { o = JSON.parse(text); } catch { throw new Error("키 파일이 아닙니다"); }
  if (!o || o.app !== "fridgey" || o.v !== 1 || typeof o.key !== "string") throw new Error("Fridgey 키 파일이 아닙니다");
  let n = 0; try { n = b64uToBytes(o.key).length; } catch {}
  if (n !== 32) throw new Error("키 형식이 올바르지 않습니다");
  return o.key;
}
// </core>

let LANG = (() => { try { const v = localStorage.getItem("fridgey.lang"); if (v === "ko" || v === "en") return v; } catch {} return /^ko/i.test(globalThis.navigator?.language || "") ? "ko" : "en"; })();

  en: { title: "Fridgey", tabFridge: "Fridge", tabShop: "Shopping", fName: "Food", fDate: "Expires", fCook: "Since", fQty: "Qty", addBtn: "Add", tabBin: "Bin", doneBtn: "Done" },
};
const DEFAULT_LABELS = DEF.ko;   // 이름 칸 목록(normalize 용)
const exDate = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()); };   // 날짜 예시 = 오늘(YYMMDD)
const T = {

  data = room.data; sync.rev = room.rev; synced = JSON.stringify(data);

async function syncNow() {
  if (!sync || busy) return;
  busy = true; clearTimeout(pushTimer);
  const wasDirty = dirty; dirty = false;
  let failed = false;
  try {
    if (wasDirty) {
      const snap = JSON.stringify(data);   // 전송하는 내용(보내는 동안 더 바뀌면 dirty 가 다시 켜져 다음에 또 보낸다)
      const res = await rpc("put_room", { p_id: sync.id, p_blob: await encrypt(sync.aes, data), p_rev: sync.rev });
      if (res < 0) {   // 다른 기기가 먼저 저장함 → 서버 내용으로 교체(마지막 저장 우선)
        const room = await readRoom();
        if (room) { dirty = false; document.querySelectorAll("dialog[open]:not(#kDlg)").forEach(d => d.close()); adopt(room); render(); showNotice(t("conflict")); }
        else { sync.rev = 0; dirty = true; }   // 서버 행이 사라짐 → 다음에 다시 만든다
      } else { sync.rev = res; synced = snap; saveSync(); }
    } else {
      const room = await readRoom();
      if (!room) { sync.rev = 0; dirty = true; }
      else if (room.rev !== sync.rev && !document.querySelector("dialog[open]")) { adopt(room); render(); }   // 대화상자가 열려 있으면 닫힌 뒤 다음 주기에
    }
    syncStatus = t("synced", new Date().toTimeString().slice(0, 5));
  } catch { failed = true; dirty = dirty || wasDirty; syncStatus = t("offline"); }

}
async function useKey(key, rev) { const { roomId, aes } = await derive(key); sync = { key, id: roomId, aes, rev }; }

    await useKey(key, 0);

    if (res < 0) throw new Error("exists");

}
async function joinRoom(text) {   // 키 파일로 참여: 서버 내용으로 이 기기 데이터를 바꾼다
  let key; try { key = parseKeyFile(text); } catch { return alert(t("badKeyFile")); }
  const prev = sync;

    await useKey(key, 0);
    const room = await readRoom();
    if (!room) { sync = prev; return alert(t("noRoom")); }
    if (!confirm(t("joinConfirm", room.data.items.length, room.data.shop.length))) { sync = prev; return; }
    adopt(room); store.set("fridgey.keysaved", sync.id); syncStatus = t("synced", new Date().toTimeString().slice(0, 5));   // 받은 키 파일로 들어왔으니 이미 보관한 것
  } catch (e) { sync = prev; alert(/http|fetch|network/i.test(e.message) ? t("noServer") : t("wrongKey")); }

    fillTo($("kBody"),
      h("h2", { id: "kTitle", textContent: t("gateTitle") }),

    $("kDlg").onclose = () => { if (store.get("fridgey.keysaved") !== sync?.id) setTimeout(() => openDlg($("kDlg")), 0); };   // 폰 뒤로가기가 창을 직접 닫아도 보관 전이면 다시 연다

  const it = { id: uid(), name: s.name, qty: s.qty, zone: data.zones.some(z => z.id === zoneId) ? zoneId : data.zones[0].id, date: todayISO(), kind: "cook" };
  data.items.push(it); data.shop = data.shop.filter(x => x !== s); save(); renderShopList(); shopSugg();
  shopBar.msg.replaceChildren(t("autoMoved", s.name, L("tabFridge"), zoneName(it.zone)), h("a", { href: "#", textContent: t("undo"), style: "color:var(--accent);font-weight:600;padding:10px 4px", onclick(e) {
    e.preventDefault(); data.items = data.items.filter(x => x !== it); s.done = false; data.shop.splice(Math.min(at, data.shop.length), 0, s); save(); shopBar.msg.textContent = ""; renderShopList(); shopSugg();
  } }));
  clearTimeout(shopUndoTimer); shopUndoTimer = setTimeout(() => { if (shopBar.msg.querySelector("a")) shopBar.msg.textContent = ""; }, 8000);
}
function renderShopList() {
  const done = data.shop.filter(s => s.done);
  shopBar.listBox.replaceChildren(
    data.shop.length ? h("label", { className: "meta", style: "display:flex;align-items:center;gap:8px;min-height:44px;margin:0;cursor:pointer" },
      h("input", { type: "checkbox", checked: autoMove, style: "width:20px;min-height:20px;flex:none", onchange() { autoMove = this.checked; savePref(); } }), t("autoMoveLabel")) : "",
    data.shop.length ? h("div", { className: "card" }, data.shop.map(s => h("div", { className: "item", style: "cursor:default" },
      h("label", { style: "display:flex;align-items:center;justify-content:center;width:44px;min-height:44px;margin:0;flex:none" },
        h("input", { type: "checkbox", checked: s.done, "aria-label": s.name, style: "width:24px;min-height:24px", onchange() { s.done = this.checked; if (s.done && autoMove) return autoMoveItem(s); save(); const n = data.shop.indexOf(s); renderShopList(); shopBar.listBox.querySelectorAll("input[type=checkbox]")[n]?.focus(); } })),
      h("div", { style: "flex:1;min-width:0" },
        h("div", { className: "name", style: s.done ? "text-decoration:line-through;opacity:.6" : "", textContent: s.name }),
        inFridgePill(s.name)),
      h("input", { value: s.qty, "aria-label": `${s.name} ${L("fQty")}`, style: "width:72px;text-align:center", maxLength: 20, onfocus() { this.select(); reveal(this); }, oninput() { s.qty = qty(this.value); save(); }, onchange() { this.value = s.qty; } }),
      h("button", { className: "ghost x", textContent: "✕", "aria-label": t("delAria", s.name), style: "padding:8px 12px;min-width:44px", onclick() { data.shop = data.shop.filter(x => x !== s); save(); renderShopList(); } }))))
      : h("div", { className: "empty", textContent: t("shopEmpty", L("tabFridge")) }),
    done.length ? h("button", { textContent: t("moveBtn", done.length, L("tabFridge")), style: "width:100%", onclick: openMove }) : "");
}

// ---- 재료 수정 ----
function openEdit(it) {
  editing = it;
  $("eName").value = it.name; $("eDate").value = fmtDate(it.date); $("eDate").classList.remove("bad"); $("eErr").textContent = "";
  $("eKind").value = it.kind; $("eQty").value = it.qty; fillZones($("eZone"), it.zone);
  openDlg($("eDlg")); $("eCancel").focus();   // 폰 키보드가 바로 뜨지 않게
}
$("eDate").oninput = () => { $("eDate").classList.remove("bad"); $("eErr").textContent = ""; delete $("eDate").dataset.note; };
$("eDate").onblur = () => tidyDate($("eDate"), $("eKind").value, m => { $("eErr").textContent = m; });
$("eForm").onsubmit = e => {
  e.preventDefault();
  const name = $("eName").value.trim(), date = parseDate($("eDate").value, $("eKind").value);
  if (!name) return $("eName").focus();
  if (date === null) { $("eDate").classList.add("bad"); $("eErr").textContent = t("badDateShort"); return $("eDate").focus(); }
  Object.assign(editing, { name, date, kind: $("eKind").value, qty: qty($("eQty").value), zone: $("eZone").value });
  save(); $("eDlg").close(); render();
};
$("eCancel").onclick = () => $("eDlg").close();
// ---- 처리(음쓰통으로) / 되돌리기 ----
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function restoreItem(it) {   // 음쓰통 → 냉장고(구역이 지워졌으면 첫 구역)
  data.bin = data.bin.filter(x => x !== it);
  const { binAt, ...back } = it;
  data.items.push({ ...back, zone: data.zones.some(z => z.id === it.zone) ? it.zone : data.zones[0].id });
  save();
}
let undoTimer;
function processItem(it) {   // 냉장고 → 음쓰통(최근 것이 위, 최대 MAX_BIN 개)
  data.items = data.items.filter(x => x !== it);
  const b = { ...it, binAt: todayISO() };
  data.bin = [b, ...data.bin].slice(0, MAX_BIN);
  save(); render();
  fb.msg.replaceChildren(t("processed", it.name, L("tabBin")), h("a", { href: "#", textContent: t("undo"), style: "color:var(--accent);font-weight:600;padding:10px 4px", onclick(e) { e.preventDefault(); if (data.bin.includes(b)) restoreItem(b); render(); } }));
  clearTimeout(undoTimer); undoTimer = setTimeout(() => { if (fb.msg.querySelector("a")) fb.msg.textContent = ""; }, 8000);
}
$("eDel").onclick = () => { const it = editing; $("eDlg").close(); processItem(it); };
$("eErase").onclick = () => {   // 음쓰통을 거치지 않고 완전히 지움(되돌릴 수 없음)
  const it = editing;
  if (!confirm(t("eraseConfirm", it.name))) return;
  data.items = data.items.filter(x => x !== it); save(); $("eDlg").close(); render();
};
function binSection() {   // 설정 안 음쓰통: 처리한 재료(최근 것부터), 되돌리기
  return h("details", { style: "margin-top:18px", open: binOpen, ontoggle() { binOpen = this.open; } },
    h("summary", { textContent: t("binSummary", L("tabBin"), data.bin.length, L("doneBtn")), style: "cursor:pointer;font-size:16px;font-weight:600;color:var(--accent);padding:10px 0" }),
    h("div", { className: "meta", textContent: t("binKeep", MAX_BIN), style: "margin-bottom:6px" }),
    data.bin.length ? data.bin.map(b => h("div", { className: "row", style: "padding:8px 0;border-top:1px solid var(--line)" },
      h("div", { className: "grow" },
        h("div", { className: "name", textContent: b.name + (b.qty !== "1" ? ` ×${b.qty}` : "") }),
        h("div", { className: "meta", textContent: [zoneName(b.zone), b.date && `${kindLabel(b.kind)} ${fmtDate(b.date)}`, b.binAt && t("binDate", +b.binAt.slice(5, 7), +b.binAt.slice(8), L("doneBtn"))].filter(Boolean).join(" · ") })),
      h("button", { className: "ghost done", textContent: t("restore"), "aria-label": t("restoreAria", b.name), onclick() { restoreItem(b); renderSettings(); } }),
      h("button", { className: "danger done", textContent: t("erase"), "aria-label": t("eraseAria", b.name), onclick() {   // 음쓰통에서 아예 지움(되돌릴 수 없음)
        if (confirm(t("eraseConfirm", b.name))) { data.bin = data.bin.filter(x => x !== b); save(); renderSettings(); }
      } })))
      : h("div", { className: "meta", textContent: t("binEmpty", L("tabFridge"), L("doneBtn")) }));
}

// ---- 장보기 → 냉장고 ----
let moveRows = [];
function openMove() {
  fillZones($("mZone"), zoneId);
  moveRows = data.shop.filter(s => s.done).map(s => ({ s, date: h("input", { inputMode: "numeric", maxLength: 12, autocomplete: "off", placeholder: t("movePh", L("fDate")), "aria-label": s.name }) }));
  moveRows.forEach((r, i) => {
    r.date.oninput = () => { r.date.classList.remove("bad"); $("mErr").textContent = ""; delete r.date.dataset.note; };
    r.date.onfocus = () => reveal(r.date);
    r.date.onblur = () => tidyDate(r.date, "exp", m => { $("mErr").textContent = `${r.s.name}: ${m}`; });
    r.date.onkeydown = e => { if (e.key === "Enter" && i < moveRows.length - 1) { e.preventDefault(); moveRows[i + 1].date.focus(); } };
  });
  $("mErr").textContent = "";
  $("mRows").replaceChildren(...moveRows.map(r => h("div", { style: "margin-top:10px" },
    h("div", { className: "name", textContent: r.s.name + (r.s.qty !== "1" ? ` ×${r.s.qty}` : "") }), r.date)));
  openDlg($("mDlg")); moveRows[0]?.date.focus();
}
$("mForm").onsubmit = e => {
  e.preventDefault();
  const dates = moveRows.map(r => parseDate(r.date.value, "exp"));
  if (dates.includes(null)) { const i = dates.indexOf(null); moveRows[i].date.classList.add("bad"); $("mErr").textContent = t("badDateShort"); return moveRows[i].date.focus(); }
  if (data.items.length + moveRows.length > MAX_ROWS) { $("mErr").textContent = t("maxItems", MAX_ROWS); return; }
  zoneId = $("mZone").value; savePref();
  moveRows.forEach((r, i) => data.items.push({ id: uid(), name: r.s.name, qty: r.s.qty, zone: zoneId, date: dates[i], kind: "exp" }));
  const moved = new Set(moveRows.map(r => r.s)); data.shop = data.shop.filter(s => !moved.has(s));
  save(); $("mDlg").close(); tab = "fridge"; render();
};
$("mCancel").onclick = () => $("mDlg").close();

// ---- 설정 ----
let wordsOpen = false, binOpen = false;
function openSettings() { renderSettings(); openDlg($("sDlg")); }
const BAD_FILE = () => t("badFile");
function renderSettings() {
  const file = h("input", { type: "file", accept: ".json,application/json", className: "hide" });
  file.onchange = async () => {
    try {
      const raw = JSON.parse(await file.files[0].text());
      if (!raw || typeof raw !== "object" || !["items", "shop", "zones"].some(k => Array.isArray(raw[k]))) return alert(BAD_FILE());
      const d = normalize(raw);
      if (!confirm(t("importConfirm", d.items.length, d.shop.length))) return;
      data = d; save(); zoneId = data.zones[0].id; renderSettings(); render();
    } catch { alert(BAD_FILE()); } finally { file.value = ""; }
  };
  const keyFile = h("input", { type: "file", accept: ".json,application/json", className: "hide" });
  keyFile.onchange = async () => { try { await joinRoom(await keyFile.files[0].text()); } finally { keyFile.value = ""; renderSettings(); render(); } };
  fillTo($("sBody"),
    h("h3", { textContent: t("hZones") }),
    data.zones.map(z => h("div", { className: "row", style: "margin-bottom:8px" },
      h("input", { value: z.name, maxLength: 20, "aria-label": t("zoneNameAria"), oninput() { z.name = this.value; save(); }, onblur() { if (!z.name.trim()) { z.name = t("zone"); this.value = z.name; save(); } } }),
      h("button", { className: "danger", textContent: "✕", "aria-label": t("zoneDelAria", z.name), style: "padding:8px 12px;min-width:44px", onclick() { delZone(z); } }))),
    h("button", { className: "ghost", textContent: t("addZone"), style: "width:100%", onclick() { data.zones.push({ id: uid(), name: t("zoneNew", data.zones.length + 1) }); save(); renderSettings(); } }),
    h("h3", { textContent: t("hLang") }),
    h("div", { className: "segs", role: "group", "aria-label": t("hLang") }, [["ko", "한국어"], ["en", "English"]].map(([l, name]) => h("button", {
      type: "button", className: "seg" + (LANG === l ? " on" : ""), "aria-pressed": String(LANG === l), lang: l, textContent: name,
      onclick() { LANG = l; store.set("fridgey.lang", l); renderSettings(); render(); },
    }))),
    h("h3", { textContent: t("hTheme") }),
    h("div", { className: "segs", role: "group", "aria-label": t("themeAria") }, Object.keys(SKINS).map(s => h("button", {
      type: "button", className: "seg" + (data.theme === s ? " on" : ""), "aria-pressed": String(data.theme === s),
      onclick() { data.theme = s; save(); applySkin(s); renderSettings(); },
    }, h("span", { className: "dot", style: `background:${SKINS[s][3]}` }), t("skinNames")[s]))),
    syncOn() ? [
      h("h3", { textContent: t("hShare") }),
      sync ? [
        h("div", { className: "note", textContent: t("sharing", syncStatus) }),
        h("button", { className: "ghost", textContent: t("saveKeyLong"), style: "width:100%", onclick: shareKey }),
        h("button", { className: "danger", textContent: t("leave"), style: "width:100%;margin-top:8px", onclick() {
          if (confirm(t("leaveConfirm"))) { leaveRoom(); renderSettings(); render(); }
        } })]
      : [
        h("div", { className: "note", textContent: t("shareNote") }),
        h("button", { textContent: t("createShared"), style: "width:100%", onclick: async () => { await createRoom(); renderSettings(); render(); } }),
        h("button", { className: "ghost", textContent: t("joinKey"), style: "width:100%;margin-top:8px", onclick: () => keyFile.click() }), keyFile]] : "",
    h("h3", { textContent: t("hData") }),
    h("div", { className: "note" },
      h("div", { textContent: t("data1", !!sync) }),
      h("div", { textContent: t("data2") }),
      h("div", { textContent: t("data3") }),
      h("div", { textContent: t("homeScreen"), style: "margin-top:8px" })),
    h("button", { className: "ghost", textContent: t("export"), style: "width:100%", onclick: () => download("fridgey-data.json", JSON.stringify(data, null, 2)) }),
    h("button", { className: "ghost", textContent: t("import"), style: "width:100%;margin-top:8px", onclick: () => file.click() }), file,
    h("button", { className: "danger", textContent: t("resetAll"), style: "width:100%;margin-top:8px", onclick() { if (confirm(t("resetConfirm"))) resetDevice(); } }),
    h("h3", { textContent: t("hHelp") }),
    h("div", { className: "meta", textContent: guideState() }),
    h("button", { className: "ghost", textContent: t("showGuide"), style: "width:100%;margin-top:8px", onclick: () => openGuide(true) }),
    guideHidden() ? h("button", { className: "ghost", textContent: t("reshow"), style: "width:100%;margin-top:8px", onclick() { store.set(GUIDE, ""); renderSettings(); } }) : "",
    binSection(),
    h("details", { style: "margin-top:18px", open: wordsOpen, ontoggle() { wordsOpen = this.open; } },
      h("summary", { textContent: t("wordsSummary", Object.keys(data.words).length), style: "cursor:pointer;font-size:16px;font-weight:600;color:var(--accent);padding:10px 0" }),
      Object.keys(data.words).length ? Object.keys(data.words).sort((a, b) => data.words[b] - data.words[a]).map(w => h("div", { className: "row", style: "margin-bottom:6px" },
        h("div", { className: "grow name", textContent: t("wordCount", w, data.words[w]) }),
        h("button", { className: "ghost x", textContent: "✕", "aria-label": t("wordDelAria", w), style: "padding:8px 12px;min-width:44px", onclick() { delete data.words[w]; save(); renderSettings(); } })))
        : h("div", { className: "meta", textContent: t("wordsEmpty") })),
    h("details", { style: "margin-top:18px" },
      h("summary", { textContent: t("renameSummary"), style: "cursor:pointer;font-size:16px;font-weight:600;color:var(--accent);padding:10px 0" }),
      Object.keys(DEFAULT_LABELS).map(k => h("div", {},
        h("label", { textContent: t("help")[k], htmlFor: "sl-" + k }),
        h("input", { id: "sl-" + k, value: data.labels[k] ?? "", placeholder: DEF[LANG][k], maxLength: 20, oninput() { data.labels[k] = this.value; save(); applyLabels(); } })))));
}
function resetDevice() {   // 이 기기의 fridgey 저장값을 전부 지우고 처음 연 상태로(서버·다른 기기 데이터는 그대로)
  clearTimeout(pushTimer); sync = null; dirty = false;   // 지우는 도중 서버로 올라가지 않게
  try { for (const k of Object.keys(localStorage)) if (k.startsWith("fridgey.")) localStorage.removeItem(k); } catch {}
  location.reload();
}
function delZone(z) {
  if (data.zones.length <= 1) return alert(t("zoneMin"));
  const n = data.items.filter(i => i.zone === z.id).length;
  if (!confirm(t("zoneDelConfirm", z.name, n))) return;
  data.zones = data.zones.filter(x => x !== z);
  data.items.forEach(i => { if (i.zone === z.id) i.zone = data.zones[0].id; });
  if (zoneId === z.id) { zoneId = data.zones[0].id; savePref(); }
  save(); renderSettings();
}
$("gear").onclick = openSettings;
$("sClose").onclick = () => $("sDlg").close();
$("sDlg").onclose = () => { data.zones.forEach(z => { if (!z.name.trim()) z.name = t("zone"); }); save(); render(); };
document.onvisibilitychange = () => {
  if (document.hidden) return;
  if (day !== new Date().toDateString() && !document.querySelector("dialog[open]")) render();
  syncNow();
};
setInterval(() => { if (!document.hidden) syncNow(); }, 30000);
$("nav").onclick = e => { const t = e.target.closest("button")?.dataset.tab; if (t && t !== tab) { tab = t; history.pushState({ tab }, ""); render(); } };

// ---- 폰 뒤로가기: 열린 창이 있으면 닫고, 없으면 이전 탭으로. 키 보관 창·시작 안내는 고르기 전엔 안 닫힘 ----
let ignorePop = false, guideLocked = false;
function openDlg(d) { d.showModal(); history.pushState({ dlg: d.id, tab }, ""); }
for (const d of document.querySelectorAll("dialog"))   // 버튼으로 닫으면 쌓아 둔 뒤로가기 한 칸을 같이 지운다
  d.addEventListener("close", () => { if (history.state?.dlg === d.id) { ignorePop = true; history.back(); } });
window.onpopstate = e => {
  if (ignorePop) { ignorePop = false; return; }
  const open = [...document.querySelectorAll("dialog[open]")].pop();
  if (open) {
    if (open.id === "kDlg" || (open.id === "gDlg" && guideLocked)) history.pushState({ dlg: open.id, tab }, "");
    else open.close();
    return;
  }
  if (e.state?.tab && e.state.tab !== tab) { tab = e.state.tab; render(); }
};
history.replaceState({ tab }, "");

if (typeof window.HTMLDialogElement?.prototype.showModal !== "function" || !Element.prototype.replaceChildren) {
  document.body.textContent = t("oldBrowser");
} else {
  try { render(); } catch {
    if (rawData) store.set("fridgey.corrupt", rawData);
    data = normalize(null); zoneId = data.zones[0].id; showNotice(t("resetData")); render();
  }
  try { navigator.storage?.persist?.(); } catch {}
  (async () => {
    if (syncOn()) try {
      const s = JSON.parse(store.get("fridgey.sync") || "null");
      if (s?.key) { await useKey(s.key, s.rev | 0); syncNow(); }
      else if (store.get("fridgey.noauto") !== "1") await autoRoom();   // 처음 켠 기기: 자동 백업 시작
    } catch {}
    await keyGate();   // 새 키면 먼저 보관하게(화면 전체)
    if (!guideHidden() && !document.querySelector("dialog[open]")) { render(); openGuide(false); }
  })();
}
</script>
